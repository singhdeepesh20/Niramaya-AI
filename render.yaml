# Staging blueprint only. Supply dedicated synthetic-data infrastructure when
# creating the Blueprint; this file intentionally does not provision a database.
services:
  - type: web
    runtime: docker
    name: niramaya-staging-api
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: >-
      sh -c 'uvicorn app.main:app --host 0.0.0.0 --port "${PORT:-10000}"'
    healthCheckPath: /health
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_KEY_PREFIX
        value: niramaya-staging
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: niramayaai-staging
      - key: LLM_API_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false
      - key: RAG_GENERATION_ENABLED
        value: "true"
      - key: EMBEDDING_ALLOW_DOWNLOAD
        value: "true"
      - key: HEALTH_VECTOR_INDEX_REQUIRED
        value: "true"

  - type: worker
    runtime: docker
    name: niramaya-staging-worker
    region: oregon
    branch: main
    autoDeployTrigger: "off"
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    dockerCommand: python -m app.documents.worker
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: AWS_REGION
        value: eu-north-1
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_KEY_PREFIX
        value: niramaya-staging
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: niramayaai-staging
      - key: EMBEDDING_ALLOW_DOWNLOAD
        value: "true"
      - key: HEALTH_VECTOR_INDEX_REQUIRED
        value: "true"
