name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt
      - name: Compile backend and tests
        run: python -m compileall -q app tests
      - name: Run tests
        run: python -m pytest -q

  migration-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: niramaya_migration_test
          POSTGRES_USER: bootstrap_test
          POSTGRES_PASSWORD: bootstrap_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bootstrap_test -d niramaya_migration_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://niramaya_migrator_test:migration_test_only@localhost:5432/niramaya_migration_test
      JWT_SECRET_KEY: disposable-ci-only-secret-with-more-than-32-bytes
      JWT_ALGORITHM: HS256
      FRONTEND_ORIGINS: "[]"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Create disposable non-superuser migration identity
        run: |
          python - <<'PY'
          import psycopg
          with psycopg.connect("host=localhost dbname=niramaya_migration_test user=bootstrap_test password=bootstrap_test_only") as connection:
              connection.execute("CREATE ROLE niramaya_migrator_test LOGIN PASSWORD 'migration_test_only'")
              connection.execute("GRANT CONNECT ON DATABASE niramaya_migration_test TO niramaya_migrator_test")
              connection.execute("GRANT USAGE, CREATE ON SCHEMA public TO niramaya_migrator_test")
          PY
      - name: Apply the complete migration chain to disposable PostgreSQL
        run: alembic upgrade head
      - name: Verify expected schema, tenant RLS, indexes, and head revision
        run: python scripts/verify_migration_schema.py

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Build API image
        run: docker build --target runtime -f Dockerfile.api -t niramaya-api:ci .
      - name: Build worker image
        run: docker build --target worker -f Dockerfile.api -t niramaya-worker:ci .
